<!doctype html>
<!--
  Slide — the plug-in's face. The CSS variables, fonts and dark-mode block are the
  prototype's (prototype/slide.html), which is the spec; the page itself carries no
  test rig, because the host supplies the audio, the transport and the presets.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{ --bg:#d6d6d6; --panel:#d2d2d2; --band:#c3c3c3; --ink:#1c1c1c; --ink2:#4f4f4f; --dim:#5d5d5d; --hair:#a9a9a9; --track:#b9b9b9; --acc:#75540a; color-scheme:light;
  --compost-ui-font:"IBM Plex Sans",system-ui,sans-serif; --compost-accent:var(--acc);
  --compost-window-bg:var(--panel); --compost-window-text:var(--ink); --compost-window-border:var(--band); --compost-window-muted:var(--dim); --compost-window-header-height:26px; --compost-window-header-font-size:11px; --compost-window-close-color:var(--dim); --compost-window-close-hover-color:var(--ink); --compost-window-grip-color:var(--hair); --compost-window-focus:var(--acc); }
:root[data-color-scheme="dark"]{ --bg:#292929; --panel:#2e2e2e; --band:#3a3a3a; --ink:#dedede; --ink2:#bdbdbd; --dim:#909090; --hair:#575757; --track:#3a3a3a; --acc:#ddc07e; color-scheme:dark }
*{box-sizing:border-box}
html,body{width:100%;height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--compost-ui-font);font-size:13px;min-height:100vh;padding:0}
compost-window{--compost-window-bg:var(--panel);--compost-window-text:var(--ink);--compost-window-border:var(--band);--compost-window-muted:var(--dim);--compost-window-header-height:26px;--compost-window-header-font-size:11px;--compost-window-close-color:var(--dim);--compost-window-close-hover-color:var(--ink);--compost-window-grip-color:var(--hair);--compost-window-focus:var(--acc)}
#face-host{height:100%}
.full{position:relative;height:100%;min-width:0}
/* The panel is the whole plug-in window, so it fills it rather than stacking in a
   scrolling page as the prototype's phone layout does. */
.mobile-panel{background:var(--panel);border:1px solid var(--band);margin:0;height:100%;display:flex;flex-direction:column}
.mobile-panel>.body{position:relative;flex:1;min-height:0}
</style>
</head>
<body>
<div id="face-host"></div>
<script type="module">
// The host owns the colour scheme; follow it, and follow a change of mind.
const root = document.documentElement;
const scheme = matchMedia('(prefers-color-scheme: dark)');
const apply = () => { root.dataset.colorScheme = scheme.matches ? 'dark' : 'light'; };
scheme.addEventListener('change', apply);
apply();
</script>
<script type="module" src="main.js"></script>
</body>
</html>
