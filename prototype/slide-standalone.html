const stepPreset=d=>{ const n=sel.options.length; sel.selectedIndex=(sel.selectedIndex+d+n)%n; sel.dispatchEvent(new Event('change')); }; $('prev').addEventListener('click',()=>stepPreset(-1)); $('next').addEventListener('click',()=>stepPreset(1));
sel.addEventListener('change',()=>{ const q=PRESETS[sel.value]; Object.assign(P,{hold:false,offset:0,ratio:1},q); if(q.link==='ratio') P.tr=P.tl*P.ratio; else if(q.link==='offset') P.tr=P.tl+P.offset; applyLink(); invalidate(); invalidateAudio(); });
function level(an){ an.getFloatTimeDomainData(A.buf); let m=0; for(let i=0;i<A.buf.length;i++){ const v=Math.abs(A.buf[i]); if(v>m) m=v; } return m; }
(function tick(){ NOW=performance.now()/1000; let live=false; if(A){ const i=level(A.anIn), o=level(A.anOut); LVL.in = i>LVL.in? i : LVL.in*0.85; LVL.out = o>LVL.out? o : LVL.out*0.93; if(LVL.in<0.001) LVL.in=0; if(LVL.out<0.001) LVL.out=0; live=LVL.in>0||LVL.out>0; }
  const animating=(media[P.medium]!=='clean'&&P.strength>0)||live;
  if(dirty||animating){ render(); dirty=false; }
  if(audioDirty){ applyAudio(); audioDirty=false; }
  requestAnimationFrame(tick); })();
