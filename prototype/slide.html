<!doctype html>
<!--
  Slide — UI prototype. See README.md in this folder.
  One canvas draws the picture, the rails, the chips and the telemetry; slide-engine.js
  is the Web Audio port of ../Engine.h. Serve the parent of tide/ so ../external/compost resolves,
  or open slide-standalone.html (built by build.py).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{ --bg:#d6d6d6; --panel:#d2d2d2; --band:#c3c3c3; --ink:#1c1c1c; --ink2:#4f4f4f; --dim:#5d5d5d; --hair:#a9a9a9; --track:#b9b9b9; --acc:#75540a; color-scheme:light;
  --compost-ui-font:"IBM Plex Sans",system-ui,sans-serif; --compost-accent:var(--acc);
  --compost-window-bg:var(--panel); --compost-window-text:var(--ink); --compost-window-border:var(--band); --compost-window-muted:var(--dim); --compost-window-header-height:26px; --compost-window-header-font-size:11px; --compost-window-close-color:var(--dim); --compost-window-close-hover-color:var(--ink); --compost-window-grip-color:var(--hair); --compost-window-focus:var(--acc); }
:root[data-color-scheme="dark"]{ --bg:#292929; --panel:#2e2e2e; --band:#3a3a3a; --ink:#dedede; --ink2:#bdbdbd; --dim:#909090; --hair:#575757; --track:#3a3a3a; --acc:#ddc07e; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--compost-ui-font);font-size:13px;min-height:100vh;padding:16px 20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim);letter-spacing:.06em;padding-bottom:10px;border-bottom:1px solid var(--band);margin-bottom:12px}
header b{color:var(--ink);letter-spacing:.3em}
header .test{display:flex;gap:8px;align-items:center;flex-wrap:wrap} header .dim{color:var(--dim);letter-spacing:0}
header select,header input{font:inherit;font-family:"IBM Plex Mono",monospace;font-size:11px;background:none;border:1px solid var(--hair);color:var(--ink);padding:3px 6px}
header button{font:inherit;color:var(--ink);background:none;border:1px solid var(--hair);padding:4px 10px;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px}
header button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
compost-window{--compost-window-bg:var(--panel);--compost-window-text:var(--ink);--compost-window-border:var(--band);--compost-window-muted:var(--dim);--compost-window-header-height:26px;--compost-window-header-font-size:11px;--compost-window-close-color:var(--dim);--compost-window-close-hover-color:var(--ink);--compost-window-grip-color:var(--hair);--compost-window-focus:var(--acc)}
.full{position:relative;height:100%;min-width:0}
.full canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mobile-panel{background:var(--panel);border:1px solid var(--band);margin:0 0 14px;display:flex;flex-direction:column}
.mobile-panel>.body{position:relative;height:var(--h,520px)}
@media(max-width:700px){ body{padding:12px 10px} header{font-size:11px} header .test .dim:first-child{display:none} }
</style>
</head>
<body>
<header><span><b>SLIDE</b></span>
  <span class="test"><button id="prev" type="button" title="previous preset">‹</button><select id="preset" aria-label="preset"></select><button id="next" type="button" title="next preset">›</button><span class="dim">test input</span><select id="voice"><option value="pluck">pluck</option><option value="pad">pad</option><option value="click">click</option></select><button id="play" type="button">play</button><button id="phrase" type="button">phrase</button><span class="dim">keys a–k</span><input id="bpm" type="number" value="120" min="40" max="240" style="width:56px"><span class="dim">bpm</span><button id="midi" type="button">midi</button><span class="dim" id="midi-st"></span><button id="scheme" type="button">dark mode</button></span></header>

<compost-window id="w" heading="Slide" width="960" height="560" resizable open>
  <div class="full" data-face="rule"><canvas class="pic" width="1600" height="900"></canvas></div>
</compost-window>

<script type="module">
import '../external/compost/src/components/compost-window.js';
import { ENGINE_SRC, WOB } from './slide-engine.js';

const MOBILE=innerWidth<700 || (matchMedia('(pointer:coarse)').matches && innerWidth<900);
if(MOBILE){ document.querySelectorAll('compost-window').forEach(w=>{ const panel=document.createElement('section'); panel.className='mobile-panel'; const body=document.createElement('div'); body.className='body'; body.style.setProperty('--h', Math.round(innerHeight*0.78)+'px'); while(w.firstChild) body.appendChild(w.firstChild); panel.append(body); w.replaceWith(panel); }); }
const root=document.documentElement; const sb=document.getElementById('scheme'); const $=id=>document.getElementById(id);
const setScheme=d=>{ root.dataset.colorScheme=d?'dark':'light'; sb.textContent=d?'light mode':'dark mode'; themeDirty=true; if(typeof invalidate==='function') invalidate(); };
root.dataset.colorScheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; sb.textContent=root.dataset.colorScheme==='dark'?'light mode':'dark mode'; sb.addEventListener('click',()=>setScheme(root.dataset.colorScheme!=='dark'));

const T={}; let themeDirty=true; const readTheme=()=>{ if(!themeDirty) return; const s=getComputedStyle(root); for(const k of ['panel','band','ink','ink2','dim','hair','track','acc','bg']) T[k]=s.getPropertyValue('--'+k).trim(); themeDirty=false; };
let RECT=null;
const MONO='"IBM Plex Mono", ui-monospace, monospace', SANS='"IBM Plex Sans", system-ui, sans-serif';
const cur=svg=>`url("data:image/svg+xml,${encodeURIComponent(svg)}") 12 12, ns-resize`;
const CUR={ wash: cur('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><g stroke="#111" fill="none" stroke-width="1.5"><line x1="12" y1="3" x2="12" y2="21"/><path d="M8 6l4-3 4 3M8 18l4 3 4-3"/><g opacity=".35" stroke-width="3"><line x1="4" y1="9" x2="20" y2="9"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="4" y1="15" x2="20" y2="15"/></g></g></svg>'),
  shape: cur('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><g stroke="#111" fill="none" stroke-width="1.5"><line x1="12" y1="3" x2="12" y2="21"/><path d="M8 6l4-3 4 3M8 18l4 3 4-3"/><path d="M3 17q6 0 9-9t9-2" opacity=".6"/></g></svg>') };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtMs=v=> v<1000? `${v<10?v.toFixed(2):v<100?v.toFixed(1):v.toFixed(0)} ms` : `${(v/1000).toFixed(v<10000?2:1)} s`;
const dB=a=>20*Math.log10(Math.max(1e-6,a));
const media=['tape','oil','bbd','tide','clean']; const MEDIA_NAME={tape:'Tape',oil:'Oil can',bbd:'Bucket',tide:'Tide',clean:'Clean'};
const NICE=[0.5,2/3,0.75,1,1.25,4/3,1.5,1.6180339887,2,3];
const TMIN=1;
const ratioName=r=>Math.abs(r-1.6180339887)<0.002?'φ':Math.abs(r-2/3)<0.002?'2:3':Math.abs(r-4/3)<0.002?'4:3':Math.abs(r-1.5)<0.002?'3:2':Math.abs(r-1)<0.002?'1:1':Math.abs(r-2)<0.002?'2:1':Math.abs(r-0.5)<0.002?'1:2':r.toFixed(2)+'×';
// ---- state
const P={tl:350, tr:525, link:'ratio', ratio:1.5, offset:175, pp:false, tap:false, sync:false, medium:0, count:8, shape:-0.6, wash:0.2, tone:0, strength:0.35, mix:0.5, hold:false, held:null};
let BPM=120; const DIVS=[['1/128',1/32],['1/64',1/16],['1/32',.125],['1/16',.25],['1/8',.5],['1/4',1],['1/2',2],['1/1',4]];
function grid(){ const q=60000/BPM; const out=[]; for(const [n,m] of DIVS){ out.push({name:n,ms:q*m,kind:'plain'}); out.push({name:n+'.',ms:q*m*1.5,kind:'dot'}); out.push({name:n+'T',ms:q*m*2/3,kind:'trip'}); } return out.filter(d=>d.ms>=1&&d.ms<=2000).sort((a,b)=>a.ms-b.ms); }
function snapT(ms){ if(!P.sync) return ms; let best=null; for(const d of grid()){ const e=Math.abs(Math.log(d.ms/ms)); if(!best||e<best.e) best={e,d}; } return best?best.d.ms:ms; }
function divOf(ms){ const d=grid().find(d=>Math.abs(d.ms-ms)<0.01); return d?d.name:null; }
function msOf(name){ const d=grid().find(d=>d.name===name); return d?d.ms:null; }
function nameT(ms){ if(!P.sync) return fmtMs(ms); const d=grid().find(d=>Math.abs(d.ms-ms)<0.01); return d?d.name:fmtMs(ms); }
function snapRatio(raw){ if(P.sync){ P.held=null; return raw; } if(P.held!=null && Math.abs(Math.log(raw/P.held))<0.025) return P.held; P.held=null; for(const r of NICE){ if(Math.abs(Math.log(raw/r))<0.012){ P.held=r; return r; } } return raw; }

// decay envelope, continuous: shape -1 fade, 0 flat, +1 swell. -60 dB span at the extremes.
const nMax=()=>64;
const gains=()=>{ const N=P.count, out=[]; for(let k=0;k<N;k++){ const u=N>1?k/(N-1):1; out.push(P.shape<0? Math.exp(-6.9*(-P.shape)*u) : Math.exp(-6.9*P.shape*(1-u))); } return out; };
let NOW=0; let LVL={in:0,out:0};
const rnd=(i)=>{ let x=(i*9301+49297)%233280; return x/233280*2-1; };
function drift(n, side){ // fraction of a decade per lap of accumulated timing wobble at this instant
  const m=media[P.medium]; const t=NOW; const amt=Math.pow(P.strength,1.8)*5; if(m==='clean'||amt<=0||drag) return 0;
  const ph=side?1.57:0; let w=0;
  if(m==='tape') w=0.35*Math.sin(2*Math.PI*0.7*t+ph)+0.15*Math.sin(2*Math.PI*6.1*t+n+ph);
  else if(m==='oil') w=0.6*Math.sin(2*Math.PI*2.3*t+ph)+0.9*Math.sin(2*Math.PI*0.33*t+rnd(n)*3+ph)*rnd(n*7+side);

  else if(m==='tide') w=0.5*(Math.sin(2*Math.PI*0.3*t+ph)+0.6*Math.sin(2*Math.PI*0.311*t+0.4)+0.35*Math.sin(2*Math.PI*0.155*t+1.9))/1.95;

const derive=()=>{ const w=P.wash, t=P.tone; const washLp=9000*Math.pow(2,-w*3.3); const toneLp=t<0? 12000*Math.pow(2,t*5.5) : 20000; const hpf=t>0? 20*Math.pow(2,t*7) : 20; return {diff:Math.min(1,w*1.15), early:Math.pow(Math.max(0,(w-0.3)/0.7),1.3), tone:clamp(Math.min(washLp,toneLp),200,20000), hpf:clamp(hpf,20,2500)}; };
const tailMs=()=> P.hold? 100000 : P.tap==='R'? P.count*P.tl+P.tr : P.tap==='L'? P.count*P.tr+P.tl : P.count*Math.max(P.tl,P.tr);
function repeats(){ const out=[]; const G=gains(), N=G.length; const th=Math.asin(P.pp?1:0.15), sk=Math.cos(th), lk=Math.sin(th); const TL=P.tl, TR=P.tr; const FLOOR=-66;
  if(P.hold){ for(let k=0;k<400;k++){ const t=P.tap==='L'?k*TR+TL:(k+1)*TL; if(t<=100000) out.push({t,side:0,a:Math.SQRT1_2,n:k+1}); const t2=P.tap==='R'?k*TL+TR:(k+1)*TR; if(t2<=100000) out.push({t:t2,side:1,a:Math.SQRT1_2,n:k+1}); if(t>100000&&t2>100000) break; } return out; }

  if(P.tap==='L'){ for(let k=0;k<N;k++){ out.push({t:k*TR+TL,side:0,a:G[k],n:k+1}); out.push({t:(k+1)*TR,side:1,a:G[k],n:k+1}); } return out; }
  const heap=[], key=new Map(); const K=e=>e.side+':'+Math.round(Math.log10(e.t)*300)+':'+e.n;
  const push=e=>{ const k=K(e); const ex=key.get(k); if(ex){ ex.a=Math.hypot(ex.a,e.a); return; } key.set(k,e); heap.push(e); let i=heap.length-1; while(i>0){ const p=(i-1)>>1; if(heap[p].t<=heap[i].t) break; [heap[p],heap[i]]=[heap[i],heap[p]]; i=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let i=0; for(;;){ const l=2*i+1, r=l+1; let m=i; if(l<heap.length&&heap[l].t<heap[m].t) m=l; if(r<heap.length&&heap[r].t<heap[m].t) m=r; if(m===i) break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } } key.delete(K(top)); return top; };

// ---- drawing
const c=document.querySelector('canvas.pic'), g=c.getContext('2d');
let hover=null, drag=null, chips=[], geo=null;
function layout(){ const r=RECT||(RECT=c.getBoundingClientRect()); const dpr=Math.min(2,devicePixelRatio||1); const W=Math.max(320,Math.round(r.width*dpr)), H=Math.max(240,Math.round(r.height*dpr)); if(c.width!==W||c.height!==H){ c.width=W; c.height=H; }
  const narrow=W/dpr<720; const u=dpr; const top=(narrow?92:60)*u; const railH=26*u, railGap=4*u; const rails=3; const bottom=H-(rails*(railH+railGap))-12*u; const axisY=bottom-4*u;
  const X0=(narrow?52:68)*u, X1=W-(narrow?116:140)*u; const Y=top+(axisY-top)/2-6*u; const HMAX=(axisY-top)/2-30*u;
  return {W,H,dpr:u,narrow,top,axisY,X0,X1,Y,HMAX,railH,railGap,railY:k=>bottom+8*u+k*(railH+railGap), vx:{wash:X1+(narrow?26:34)*u, shape:X1+(narrow?62:74)*u, tone:X1+(narrow?98:114)*u}, vTop:Y-HMAX, vBot:Y+HMAX, XD:v=>X0+Math.log10(v)/5*(X1-X0), perDec:(X1-X0)/5}; }
const txt=(s,x,y,size,col,align='center',base='alphabetic',font=MONO,weight=400)=>{ g.fillStyle=col; g.font=`${weight} ${size}px ${font}`; g.textAlign=align; g.textBaseline=base; g.fillText(s,x,y); };
const line=(x1,y1,x2,y2,col,w=1,a=1)=>{ g.strokeStyle=col; g.lineWidth=w; g.globalAlpha=a; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); g.globalAlpha=1; };
function chip(x,y,label,on,key,align,acc){ const {dpr}=geo; g.font=`500 ${Math.round(11*dpr)}px ${MONO}`; const w=g.measureText(label).width+16*dpr, h=22*dpr; const X=align==='right'?x-w:x; const hot=hover===key&&!drag; g.fillStyle=on?T.ink:hot?T.ink:T.dim; g.textAlign='left'; g.textBaseline='middle'; g.fillText(label,X+8*dpr,y+h/2+1); if(on||hot){ g.fillStyle=on?(acc?T.acc:T.ink):T.hair; g.fillRect(X+8*dpr,y+h-3*dpr,w-16*dpr,(on?2:1)*dpr); } chips.push({x:X,y,w,h,key}); return X; }
// a rail with slide-rule ticks. ticks: [{x,len,label?,major}] already in pixels. handle at hx.
function rail(y,name,ticks,hx,handleCol,active,label,idx){ const {X0,X1,dpr,railH}=geo; const a=active?1:0.55; line(X0,y+railH*0.55,X1,y+railH*0.55,T.hair,1,a);
  for(const t of ticks){ if(t.x<X0-1||t.x>X1+1) continue; line(t.x,y+railH*0.55,t.x,y+railH*0.55-(t.major?9:t.mid?6:3.5)*dpr,t.major?T.ink2:T.dim,t.major?1:0.7,a*(t.major?1:.7)); if(t.label!=null) txt(t.label,t.x,y+railH*0.55-11*dpr,Math.round(8.5*dpr),T.dim,'center','bottom'); }
  txt(name,X0-8*dpr,y+railH*0.55,Math.round(9*dpr),active?T.ink:T.dim,'right','middle');
  if(idx!=null){ line(idx,y+railH*0.55-12*dpr,idx,y+railH*0.55+3*dpr,T.dim,1,a*.8); txt('1',idx,y+railH*0.55+5*dpr,Math.round(8*dpr),T.dim,'center','top'); }

  line(hx,y+railH*0.55-11*dpr,hx,y+railH-1*dpr,handleCol,active?2:1.2,1); g.fillStyle=handleCol; g.beginPath(); g.moveTo(hx-5.5*dpr,y+railH-1*dpr); g.lineTo(hx+5.5*dpr,y+railH-1*dpr); g.lineTo(hx,y+railH-7*dpr); g.closePath(); g.fill();
  if(label){ txt(label,X1+8*dpr,y+railH*0.55,Math.round(9.5*dpr),active?T.ink:T.dim,'left','middle'); } }
function logTicks(X,lo,hi,labels=true){ const out=[]; for(let d=Math.floor(Math.log10(lo)); d<=Math.ceil(Math.log10(hi)); d++){ const b=Math.pow(10,d); for(let m=1;m<10;m++){ const v=b*m; if(v<lo*0.999||v>hi*1.001) continue; const major=m===1, mid=m===2||m===5; out.push({x:X(v),major,mid,label:(labels&&(major||(!geo.narrow&&mid&&v>=10)))?(v<1000?v:(v/1000)+'s'):null}); const steps=m<3?10:5; for(let s=1;s<steps;s++){ const vv=v+b*s/steps; if(vv>hi) break; out.push({x:X(vv)}); } } } return out; }

  X=narrow?16*dpr:X+chips[chips.length-1].w+22*dpr; X=chip(X,y2,'Sync',P.sync,'sync','left'); X=X+chips[chips.length-1].w+6*dpr; const mx0=chip(X,y2,MEDIA_NAME[media[P.medium]],false,'medium','left'); { const ch=chips[chips.length-1]; const bw=(narrow?56:80)*dpr, bx=mx0+ch.w+6*dpr, by=y2+ch.h/2+1; const on=which==='mediumBar'; line(bx,by,bx+bw,by,T.hair,1,on?1:.55); for(let i=0;i<=8;i++) line(bx+bw*i/8,by,bx+bw*i/8,by-(i%4?2.5:5)*dpr,T.dim,0.8,.7); const hx=bx+bw*P.strength; line(hx,by-7*dpr,hx,by+5*dpr,media[P.medium]==='clean'?T.dim:T.ink,on?2.2:1.4); if(on) txt(`${Math.round(P.strength*100)}`,bx+bw+6*dpr,by,Math.round(9*dpr),T.dim,'left','middle'); chips.push({x:bx-6*dpr,y:by-12*dpr,w:bw+12*dpr,h:24*dpr,key:'mediumBar',rail:{x0:bx,w:bw}}); }
  let xr=W-16*dpr;

  if(v==='pad'){ f.frequency.setValueAtTime(freq*(2+8*vel),t); f.Q.value=0.7; e.gain.setValueAtTime(0.0001,t); e.gain.exponentialRampToValueAtTime(amp*0.6,t+0.08); voices.set(id,{stop:()=>{ const tt=ctx.currentTime; e.gain.setTargetAtTime(0.0001,tt,0.12); o.stop(tt+0.8); o2.stop(tt+0.8); }}); }
  else { f.frequency.setValueAtTime(freq*(4+12*vel),t); f.frequency.exponentialRampToValueAtTime(freq*1.5,t+0.12); e.gain.setValueAtTime(0.0001,t); e.gain.exponentialRampToValueAtTime(amp,t+0.004); e.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.stop(t+0.2); o2.stop(t+0.2); } }

let phraseTimer=null; $('phrase').addEventListener('click',async()=>{ if(phraseTimer){ clearInterval(phraseTimer); phraseTimer=null; $('phrase').classList.remove('on'); return; } await ensure(); const seq=[[220,1],[0,0],[220,.25],[220,.25],[330,1],[0,0],[247,.2],[0,0],[220,.25],[196,1],[0,0],[220,.2],[247,.25],[0,0],[330,.9],[0,0]]; let i=0; const step=()=>{ const [f,v]=seq[i%seq.length]; if(f) noteOn(f,v,'ph'); i++; }; step(); phraseTimer=setInterval(step,60000/BPM/2); $('phrase').classList.add('on'); });
$('bpm').addEventListener('input',()=>{ const v=+$('bpm').value; if(v>=40&&v<=240){ const dl=P.sync?divOf(P.tl):null, dr=P.sync?divOf(P.tr):null; BPM=v; if(dl&&msOf(dl)) P.tl=clamp(msOf(dl),TMIN,2000); if(dr&&msOf(dr)&&P.link==='off') P.tr=clamp(msOf(dr),TMIN,2000); applyLink(); invalidate(); invalidateAudio(); } });

$('midi').addEventListener('click',async()=>{ await ensure(); if(!navigator.requestMIDIAccess){ $('midi-st').textContent='no Web MIDI'; return; } try{ const acc=await navigator.requestMIDIAccess(); const wire=()=>{ const names=[]; for(const inp of acc.inputs.values()){ inp.onmidimessage=ev=>{ const [st,n,v]=ev.data; const cmd=st&0xf0; if(cmd===0x90&&v>0) noteOn(440*Math.pow(2,(n-69)/12), v/127, 'm'+n); else if(cmd===0x80||(cmd===0x90&&v===0)) noteOff('m'+n); }; names.push(inp.name); } $('midi-st').textContent=names.join(', ')||'no inputs'; $('midi').classList.toggle('on',names.length>0); }; wire(); acc.onstatechange=wire; } catch(e){ $('midi-st').textContent='midi blocked'; } });

function level(an){ an.getFloatTimeDomainData(A.buf); let m=0; for(let i=0;i<A.buf.length;i++){ const v=Math.abs(A.buf[i]); if(v>m) m=v; } return m; }
(function tick(){ NOW=performance.now()/1000; let live=false; if(A){ const i=level(A.anIn), o=level(A.anOut); LVL.in = i>LVL.in? i : LVL.in*0.85; LVL.out = o>LVL.out? o : LVL.out*0.93; if(LVL.in<0.001) LVL.in=0; if(LVL.out<0.001) LVL.out=0; live=LVL.in>0||LVL.out>0; }
  const animating=(media[P.medium]!=='clean'&&P.strength>0)||live;
  if(dirty||animating){ render(); dirty=false; }
  if(audioDirty){ applyAudio(); audioDirty=false; }
  requestAnimationFrame(tick); })();
